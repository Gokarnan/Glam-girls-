 if(t.chars)h+=CH.map(c=>{const u=S.chars.includes(c.id);return `<div class="it"><div style="height:80px;width:44px">${av(c,base(c),{},0)}</div><b>${c.n}<small>Character</small></b><button class="${u?(S.sel==c.id?'x':'t'):CH.length&&S.coins>=c.p?'g':'x'}" data-a="char:${c.id}:s">${u?(S.sel==c.id?'EQUIPPED':'OWNED'):S.coins>=c.p?'BUY 🪙'+c.p:'🔒 🪙'+c.p}</button></div>`}).join('');
 else t.c.forEach(c=>L_[c].forEach((it,i)=>{if(t.f&&!t.f(it))return;if(it.p==0&&!MKC.includes(c))return;const o=own(c,i),e=o&&gv(c)==i;h+=`<div class="it" id="r${c}${i}"><div class="dot" style="background:${it.c};width:44px;height:44px">${c=='sticker'?['★','♥','◆','☾'][i]:LAB[c][1]}</div><b>${it.n}<small>${LAB[c][0]}</small></b><button class="${e?'x':o?'t':S.coins>=it.p?'g':'x'}" data-a="buy:${c}:${i}">${e?'EQUIPPED':o?'OWNED':S.coins>=it.p?'BUY 🪙'+it.p:'🔒 🪙'+it.p}</button></div>`}));
 m.innerHTML=h+'</div>';const sc=$('.sc');if(sc)sc.scrollLeft=window._ss||0}};
const SL=['That look is iconic!','Main-stage energy!','Fashion goals unlocked!','You understood the theme!','The sparkle is giving!','So chic!','This look is a total slay!','Born for the spotlight!','Big fashion energy!','That styling is on fire!','The confidence is everything!','A true star moment!','This outfit is ready for the runway!','The details are absolutely gorgeous!','That look is pink-and-black perfection!'];

{n:'Jennie',l:'Luxe & Confidence',h:'#1b1b22',d:'#2a2a33',a:'#ff5fa2',k:'★',s:'#f3d3bd',u:1,L:['This look brings serious fashion energy!','The styling is bold, confident, and memorable!','Your outfit has a strong statement moment!','This is polished, modern, and full of attitude!'],tip:'a bold statement accessory'},
{n:'Rosé',l:'Creative & Romantic',h:'#c9a074',d:'#ffc2d4',a:'#8ec5ff',k:'✿',s:'#f8dcc6',L:['The colors blend together beautifully!','This look feels creative and expressive!','The styling has a lovely dreamy quality!','Every detail adds personality to the outfit!'],tip:'one more artistic detail'},
{n:'Lisa',l:'Stage Presence',h:'#2b2024',d:'#7c3aed',a:'#ffd75e',k:'★',s:'#f0cdb0',u:1,L:['This look is full of stage-ready energy!','You made a powerful fashion entrance!','The styling is playful, bold, and exciting!','That pose gives the outfit an unforgettable finish!'],tip:'an energetic finishing touch'}];
const jav=j=>`<svg viewBox="0 0 80 100"><path d="M14 52Q10 8 40 8Q70 8 66 52L70 84H10Z" fill="${j.h}"/>${j.u?`<circle cx="40" cy="6" r="8" fill="${j.h}"/>`:''}<path d="M18 100L24 64H56L62 100Z" fill="${j.d}"/><path d="M24 72H56" stroke="${j.a}" stroke-width="3"/><circle cx="40" cy="40" r="20" fill="${j.s}"/><path d="M21 38Q40 12 59 38Q40 26 21 38Z" fill="${j.h}"/><circle cx="33" cy="42" r="2.4" fill="#222"/><circle cx="47" cy="42" r="2.4" fill="#222"/><path d="M34 51Q40 56 46 51" stroke="#d6336c" fill="none" stroke-width="2"/><text x="50" y="22" font-size="15" fill="${j.a}">${j.k}</text></svg>`;
function cnt(el,to,d,dec){const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/d);el.textContent=(to*k).toFixed(dec);if(k<1)requestAnimationFrame(f);else el.textContent=to.toFixed(dec)})(t0)}
function bgm(){if(!S.music)return;(BPM()?[330,392,494,659,494,392]:[262,330,392,523,392,330]).forEach((f,i)=>later(i*260,()=>tone(f,.18,0)));later(1700,bgm)}
function judgeBP(t){const js=res.bp.js,tot=res.coins+res.b1+res.b2+res.b3;
 m.innerHTML=`<div class="top"><span class="bpb">BLACKPINK MODE</span></div><h2>Fashion Judges</h2><div class="grid jg">${JV.map((j,i)=>`<div class="card jc">${jav(j)}<b>${j.n}</b><small>${j.l}</small><div class="js"><span id="js${i}">0.0</span>/10</div><small id="jt${i}" class="jq"> </small></div>`).join('')}</div><div class="card" id="fin" style="visibility:hidden"><div class="sco" style="font-size:clamp(44px,14vw,70px)"><span id="ft">0</span><small style="font-size:.35em">/100</small></div>🪙 +${tot} coins${res.b3?'<br>BLACKPINK MODE BONUS: +10 coins!':''}</div><small class="dis">Fan-inspired mode. Not affiliated with or endorsed by BLACKPINK.</small><button class="big g" id="nx" style="display:none" data-a="go:reward">See Rewards 🪙</button>`;bgm();
 js.forEach((s,i)=>later(600+i*1100,()=>{cnt($('#js'+i),s,800,1);sfx('judge');vib(8);const j=JV[i],sl=' '+SL[Math.random()*15|0];$('#jt'+i).textContent=s>=7?j.L[Math.random()*4|0]+sl:'Lovely start—try adding '+j.tip+'!'+(s>=6?sl:'')}));
 later(600+4*1100,()=>{$('#fin').style.visibility='visible';cnt($('#ft'),t,900,0);sfx(t>=75?'hi':'bp');$('#nx').style.display='block'})}
const SHT=[{n:'Girls',chars:1},{n:'Dresses',c:['dress'],f:i=>i.s!='t'},{n:'Tops',c:['dress'],f:i=>i.s=='t'},{n:'Bottoms',c:['bottom']},{n:'Shoes',c:['shoes']},{n:'Hair',c:['hair']},{n:'Hair Acc.',c:['hacc']},{n:'Jewelry',c:['ear','neck','brace']},{n:'Bags & Coats',c:['bag','jacket']},{n:'Makeup',c:MKC},{n:'Effects',c:['fx']}];
/* ---------- STUDIO ---------- */
let curTab=0;const tabsOf=()=>mode=='style'?STY:MKC.concat(['look']);
function studio(md){mode=md;tab=tabsOf()[0];
 m.innerHTML=`<div class="top">${back(md=='style'?'theme':'style')}<div class="ban" style="background:${theme.c}">${theme.e} ${theme.n}</div><button class="v" data-a="rst" aria-label="Reset">↺</button></div><div class="pv" id="pv"></div><div class="sc" id="tabs"></div><div class="sc" id="tray"></div><div class="bar"><button class="v" data-a="nav:-1">◀</button><button class="x" data-a="none">✖</button><button class="v" data-a="nav:1">▶</button><button class="g" data-a="wd">💾</button><button class="w" data-a="${md=='style'?'go:makeup':'go:runway'}">${md=='style'?'Makeup ▶':'Present ▶'}</button></div>`;upT();upTray();upPv()}
const upPv=()=>{$('#pv').innerHTML=myAv(1)};
function upT(){$('#tabs').innerHTML=tabsOf().map(t=>`<button class="tab ${t==tab?'on':''}" data-a="tab:${t}">${t=='look'?'💄<br>Looks':LAB[t][1]+'<br>'+LAB[t][0]}</button>`).join('')}
function upTray(){const tr=$('#tray'),sl=tr.scrollLeft;tr.innerHTML=tab=='look'?PRE.map((p,i)=>`<div class="tile" data-a="pre:${i}"><div class="dot" style="background:#f9a8d4">💄</div>${p[0]}</div>`).join(''):L_[tab].map((x,i)=>tile(tab,i,gv(tab)==i)).join('');tr.scrollLeft=sl}
function setItem(c,i){if(!own(c,i)){sfx('err');toast('Locked! Buy it in the Shop for 🪙'+L_[c][i].p);return}slot(c)[c]=i;save();sfx(MKC.includes(c)?'mk':'equip');vib();upPv();upTray()}
/* ---------- ACTIONS ---------- */
const A={
go(v){sfx('tap');go(v)},
mute(){S.mute=S.mute?0:1;save();sfx('tap');go(cur)},vib(){S.vib=S.vib?0:1;save();vib(30);go(cur)},
char(id,s){const c=CH.find(x=>x.id==id);if(!S.chars.includes(id)){if(S.coins<c.p){sfx('err');toast('Not enough coins — you need 🪙'+(c.p-S.coins)+' more!');return}S.coins-=c.p;S.chars.push(id);sfx('unlock');toast(c.n+' joined your team! 🎉')}else sfx('pick');
 S.sel=id;const L=S.look;L.skin=c.skin;L.eyes=c.eyes;L.hair=c.hair;L.hairc=c.hc;S.own['hair:'+c.hair]=1;save();vib();go(cur,s?window._st:undefined)},
th(id){theme=TH.find(t=>t.id==id);sfx('pick');go('style')},rand(){theme=TH[Math.random()*12|0];sfx('pick');toast('Theme: '+theme.n+' '+theme.e);go('style')},
tab(t){tab=t;sfx('tap');upT();upTray()},
pick(i){setItem(tab,+i)},
pre(i){const p=PRE[i][1];let sk=0;MKC.forEach(k=>{if(k in p){if(own(k,p[k]))S.mk[k]=p[k];else sk++}else S.mk[k]=-1});save();sfx('mk');upPv();if(sk)toast('Some items are locked — find them in the Shop!')},
nav(d){if(tab=='look')return;const n=L_[tab].length;let i=gv(tab);for(let k=0;k<n;k++){i=((i+d)%n+n)%n;if(own(tab,i))return setItem(tab,i)}},
none(){if(tab=='look'||['skin','eyes','hair','hairc'].includes(tab)){sfx('err');toast('This one can’t be removed');return}slot(tab)[tab]=-1;save();sfx('tap');upPv();upTray()},
rst(){if(mode=='style')S.look=base(ch());else S.mk={};save();sfx('tap');toast('Look reset');upPv();upTray()},
wd(){S.wd.unshift({c:S.sel,L:Object.assign({},S.look),M:Object.assign({},S.mk),th:theme.id,sc:res&&cur=='reward'?res.total:0});S.wd=S.wd.slice(0,12);save();sfx('equip');toast('Saved to your wardrobe! 👚')},
wear(i){const w=S.wd[i];S.sel=w.c;S.look=Object.assign({},w.L);S.mk=Object.assign({},w.M);save();sfx('equip');toast('Look equipped!');go('style')},
del(i){S.wd.splice(i,1);save();sfx('tap');go('wardrobe')},
pose(){posed=true;if(BPM()){[0,1,2].forEach(i=>later(i*550,()=>{rw.ps=i;sfx('pick');vib(10)}))}else{sfx('pick');vib()}},present(){sfx('run');go('judge')},
stab(i){window._ss=$('.sc').scrollLeft;sfx('tap');go('shop',+i)},
buy(c,i){i=+i;const it=L_[c][i];window._ss=$('.sc').scrollLeft;const ti=SHT.findIndex(t=>t.c&&t.c.includes(c)&&(!t.f||t.f(it)));
 if(own(c,i)){slot(c)[c]=i;save();sfx('equip');vib();return go('shop',ti)}
 if(S.coins<it.p){sfx('err');toast('Not enough coins — you need 🪙'+(it.p-S.coins)+' more!');vib([30,40,30]);return}
 S.coins-=it.p;S.own[c+':'+i]=1;slot(c)[c]=i;save();sfx('buy');vib(25);go('shop',ti);const r=$('#r'+c+i);if(r)r.classList.add('pop');toast('Bought '+it.n+'! 🎀 Equipped.')},
music(){S.music=S.music?0:1;save();sfx('tap');go(cur)},bp(){S.blackpinkModeEnabled=!S.blackpinkModeEnabled;save();sfx(BPM()?'bp':'tap');vib();go(cur)},
reset(){const b=$('#rs');if(b.dataset.c){localStorage.removeItem(K);S=Object.assign({},S0,{own:{},mk:{},wd:[],chars:['ava']});S.look=base(CH[0]);save();sfx('tap');go('home')}else{b.dataset.c=1;b.textContent='Tap again to erase everything'}}};
let lastT=0;
function onTap(e){const t=e.target.closest('[data-a]');if(!t||paused)return;const n=performance.now();if(n-lastT<120)return;lastT=n;const p=t.dataset.a.split(':');const f=A[p[0]];if(f)f.apply(null,p.slice(1))}
$('#app').addEventListener('pointerup',onTap);
window.addEventListener('pagehide',save);
go('home');
</script></body></html>
